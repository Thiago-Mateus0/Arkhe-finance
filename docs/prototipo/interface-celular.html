<title>Arkhe Finance Mockup</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&display=swap">
<style>
/* Layout: app escuro em tela cheia: aurora colorida no topo, cartões de vidro, navegação flutuante em pílula. Visual escuro por escolha (como a referência). */
:root{
  color-scheme:dark;
  --stage:#000; --bg:#000; --glass:#ffffff0d; --glass-2:#ffffff14; --edge:#ffffff1a; --edge-2:#ffffff2e; --scrim:#000b;
  --text:#fff; --text-2:#d3d3d6; --muted:#8e8e96;
  --accent:#22d3ee; --on-accent:#00161b;
  --pos:#5fe39a; --neg:#ff6b6b; --warn:#fbbf24;
  --c1:#22d3ee; --c2:#4ade80; --c3:#a78bfa; --c4:#fb923c; --c5:#f472b6; --c6:#64748b;
  --sans:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:#000}
body{margin:0;color:var(--text);font:16px/1.35 var(--sans);padding:0}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:none}
.phone{width:410px;max-width:100%;height:min(860px,100dvh);margin:24px auto;background:#000;border:1px solid var(--edge);border-radius:46px;position:relative;overflow:hidden;isolation:isolate}
@media (max-width:520px){.phone{width:100%;margin:0;height:100dvh;border:0;border-radius:0}}
.aurora{position:absolute;inset:-40px -40px auto -40px;height:520px;z-index:-1;pointer-events:none;filter:blur(36px) saturate(1.25);
  -webkit-mask-image:linear-gradient(#000 35%,transparent 100%);mask-image:linear-gradient(#000 35%,transparent 100%)}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:drift 14s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60%;height:70%;left:-5%;top:-10%;background:#22d3ee}
.aurora i:nth-child(2){width:55%;height:65%;right:-8%;top:-12%;background:#6366f1;animation-delay:-4s}
.aurora i:nth-child(3){width:50%;height:55%;left:30%;top:28%;background:#f472b6;animation-delay:-8s}
.aurora i:nth-child(4){width:40%;height:45%;right:-5%;top:40%;background:#fb923c;animation-delay:-11s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(8%,6%) scale(1.15)}}
.screens{position:absolute;inset:0}
.screen{position:absolute;inset:0;overflow-y:auto;padding:max(18px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 190px max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:12px;scrollbar-width:none;opacity:0;pointer-events:none;transition:opacity .3s}
.screen::-webkit-scrollbar{display:none}
.screen.on{opacity:1;pointer-events:auto}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
.n{font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.025em}
.hide .v{filter:blur(10px);user-select:none}
.v{transition:filter .25s}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px}
.avatar{width:46px;height:46px;border-radius:50%;background:conic-gradient(from 200deg,#22d3ee,#a78bfa,#f472b6,#22d3ee);display:grid;place-content:center;font-weight:700;color:#000;border:2px solid #ffffff55}
.round{width:46px;height:46px;border-radius:50%;background:#00000055;border:1px solid var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);display:grid;place-content:center}
.round svg,.mesbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mesbtn{display:flex;align-items:center;gap:6px;background:var(--accent);color:var(--on-accent);font-weight:600;padding:12px 18px;border-radius:99px;box-shadow:0 6px 28px #22d3ee66}
.mesbtn svg{width:18px;height:18px}
.hello{font-size:2.3rem;font-weight:400;letter-spacing:-.035em;margin:78px 0 10px;text-wrap:balance}
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.tab{padding:11px 18px;border-radius:99px;background:#ffffff1f;border:1px solid var(--edge);color:var(--text);white-space:nowrap;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transition:background .25s,color .25s,transform .15s}
.tab:active{transform:scale(.95)}
.tab.on{background:#f2f2f2;color:#000;font-weight:600;border-color:#f2f2f2}
.card{position:relative;display:block;width:100%;border-radius:32px;padding:20px;overflow:hidden;
  background:linear-gradient(180deg,#ffffff12,#ffffff06),#0c0c0e;border:1px solid var(--edge);box-shadow:inset 0 1px 0 #ffffff22;transition:transform .18s}
button.card:active{transform:scale(.97)}
.tint-v{background:linear-gradient(160deg,#a78bfa30,#0c0c0e 60%),#0c0c0e}
.tint-c{background:linear-gradient(160deg,#22d3ee2e,#0c0c0e 60%),#0c0c0e}
.tint-o{background:linear-gradient(160deg,#fb923c26,#0c0c0e 60%),#0c0c0e}
.tint-g{background:linear-gradient(170deg,#4ade8026,#0c0c0e 65%),#0c0c0e}
.chev{position:absolute;top:18px;right:20px;color:var(--muted);font-size:1.2rem;line-height:1}
.lbl{color:var(--text-2);font-size:.95rem;opacity:.8}
.val{font-size:1.65rem;font-weight:700;margin-top:3px}
.val.big{font-size:2.2rem}
.sub{color:var(--muted);font-size:.92rem;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid .card{min-height:190px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px}
.grid .val{font-size:1.45rem}
.chip{width:50px;height:50px;border-radius:50%;background:#fff;display:grid;place-content:center;margin-bottom:auto}
.chip svg{width:24px;height:24px;stroke:#6d28d9;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.chip.dark{background:#ffffff1c}.chip.dark svg{stroke:var(--text-2)}
.ring{margin-bottom:auto;width:72px;height:72px;filter:drop-shadow(0 0 10px #fb923c55)}
.ring circle:last-child{transition:stroke-dasharray 1s cubic-bezier(.2,.8,.2,1)}
.flowbars{display:flex;flex-direction:column;gap:6px;margin-bottom:auto;padding-top:8px;padding-right:22px}
.flowbars i{display:block;height:7px;border-radius:99px}
.pos{color:var(--pos)} .neg{color:var(--neg)} .warn{color:var(--warn)}
.car{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;gap:12px;margin:0 -2px;padding:0 2px}
.car::-webkit-scrollbar{display:none}
.car>.card{flex:0 0 100%;scroll-snap-align:center}
.bank{background:#8a05e0;border-radius:22px;padding:22px 20px;display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:1.6rem;letter-spacing:-.04em;box-shadow:0 10px 30px #8a05e055}
.bank span:last-child{font-size:1rem;font-weight:600;letter-spacing:0}
.dots{display:flex;justify-content:center;gap:6px;margin-top:14px}
.dots i{width:7px;height:7px;border-radius:99px;background:#ffffff40;transition:width .25s,background .25s}
.dots i.on{width:26px;background:#fff}
.chartwrap{position:relative;margin-top:12px;touch-action:pan-y;cursor:crosshair}
.chart{display:block;overflow:visible}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.3s .2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.areafade{opacity:0;animation:fadein .9s .8s forwards}
@keyframes fadein{to{opacity:1}}
.bubble{position:absolute;top:-6px;transform:translateX(-50%);background:var(--accent);color:var(--on-accent);font-weight:700;font-size:.82rem;padding:5px 10px;border-radius:10px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.bubble.on{opacity:1}
.axis{display:flex;justify-content:space-between;color:var(--muted);font-size:.78rem;margin-top:6px}
.seg{display:flex;gap:6px;margin-top:16px;height:18px}
.seg button{border-radius:99px;min-width:10px;height:100%;transform-origin:left;animation:grow .8s cubic-bezier(.2,.8,.2,1) both;transition:opacity .2s,transform .2s}
@keyframes grow{from{transform:scaleX(0)}}
.seg.has button{opacity:.3}
.seg.has button.pick{opacity:1;transform:scaleY(1.5)}
.segline{display:flex;justify-content:space-between;margin-top:14px;font-size:.92rem;min-height:22px}
.tx{display:flex;gap:13px;align-items:center;padding:13px 0;border-top:1px solid var(--edge);width:100%}
.tx:first-of-type{border-top:0}
.ic{width:46px;height:46px;border-radius:50%;background:#ffffff1a;display:grid;place-content:center;font-weight:700;font-size:.85rem;color:var(--text-2);flex:none}
.tx .t{flex:1;min-width:0}
.tx .t b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t small{color:var(--muted);font-size:.84rem}
.tx>.n{font-weight:600}
.badge{font-size:.72rem;padding:2px 9px;border-radius:99px;background:#fbbf2426;color:var(--warn);font-weight:600}
h1{margin:34px 0 4px;font-size:2rem;font-weight:500;letter-spacing:-.035em}
.track{height:12px;border-radius:99px;background:#ffffff14;overflow:hidden;margin-top:16px}
.fill{height:100%;border-radius:99px;width:0;transition:width 1s cubic-bezier(.2,.8,.2,1)}
.meta{display:flex;justify-content:space-between;gap:10px;margin-top:10px;font-size:.88rem;color:var(--muted)}
.dock{position:absolute;left:0;right:0;bottom:0;padding:44px max(12px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px));
  display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,#000 55%);pointer-events:none}
.dock>*{pointer-events:auto}
.glass{background:#161618b8;backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1px solid var(--edge-2)}
.ask{display:flex;align-items:center;gap:12px;padding:15px 20px;border-radius:99px;color:var(--text-2);width:100%;position:relative}
.ask svg{width:22px;height:22px;stroke:var(--accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ask::after{content:"";position:absolute;inset:-1px;border-radius:99px;padding:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,#22d3ee99,#a78bfa99,transparent);background-size:200% 100%;animation:sweep 5s linear infinite;
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
@keyframes sweep{from{background-position:200% 0}to{background-position:-200% 0}}
.navrow{display:flex;gap:10px}
.nav{flex:1;display:flex;padding:6px;border-radius:99px;gap:4px}
.nav button{flex:1;display:grid;place-content:center;height:54px;border-radius:99px;color:var(--muted);transition:background .25s,color .25s,transform .15s}
.nav button:active{transform:scale(.92)}
.nav button.on{background:#ffffff1f;color:var(--accent)}
.nav svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.plus{width:66px;height:66px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-content:center;flex:none;box-shadow:0 8px 30px #22d3ee77;transition:transform .2s}
.plus:active{transform:scale(.9) rotate(90deg)}
.plus svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round}
.sheet-wrap{position:absolute;inset:0;background:var(--scrim);opacity:0;pointer-events:none;transition:opacity .3s;z-index:5}
.sheet-wrap.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#121214;border-top:1px solid var(--edge-2);border-radius:34px 34px 0 0;
  padding:12px max(20px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(20px,env(safe-area-inset-left,0px));
  transform:translateY(100%);transition:transform .38s cubic-bezier(.2,.9,.2,1);max-height:80%;overflow-y:auto}
.sheet-wrap.on .sheet{transform:none}
.grab{width:42px;height:5px;border-radius:99px;background:#ffffff33;margin:0 auto 6px}
.sheet h2{margin:0 0 4px;font-size:1.4rem;font-weight:600;letter-spacing:-.02em}
.drop{margin-top:18px;border:1.5px dashed var(--edge-2);border-radius:24px;padding:36px 16px;text-align:center;color:var(--muted)}

.day{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px 0 2px;font-weight:600}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:99px;height:50px}
.search svg{width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit}
.search input::placeholder{color:var(--muted)}
.alert{display:flex;gap:14px;align-items:center;padding:16px 18px;border-radius:26px}
.alert .ic2{width:44px;height:44px;border-radius:50%;display:grid;place-content:center;flex:none;font-weight:800;font-size:1.1rem}
.alert b{display:block;font-weight:600}
.alert small{color:var(--text-2);opacity:.75}
.alert .go{margin-left:auto;color:var(--muted);font-size:1.2rem}
.a-neg{background:linear-gradient(120deg,#ff6b6b2e,#0c0c0e 70%),#0c0c0e;border:1px solid #ff6b6b44}
.a-neg .ic2{background:#ff6b6b26;color:var(--neg)}
.a-warn{background:linear-gradient(120deg,#fbbf2429,#0c0c0e 70%),#0c0c0e;border:1px solid #fbbf2444}
.a-warn .ic2{background:#fbbf2424;color:var(--warn)}
.pdot{position:absolute;top:8px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:99px;background:var(--warn);color:#000;font:700 .7rem/18px var(--sans);text-align:center;padding:0 5px}
.nav button{position:relative}
.pickgrid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.pk{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:99px;border:1px solid var(--edge-2);background:#ffffff0d;transition:background .2s,border-color .2s,transform .15s}
.pk:active{transform:scale(.95)}
.pk i{width:9px;height:9px;border-radius:50%}
.pk.on{background:#fff;color:#000;border-color:#fff;font-weight:600}
.rule{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding:14px 16px;border-radius:20px;background:#ffffff0d;border:1px solid var(--edge)}
.rule small{display:block;color:var(--muted)}
.sw{position:relative;width:52px;height:30px;flex:none}
.sw input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.sw span{position:absolute;inset:0;border-radius:99px;background:#ffffff26;transition:background .2s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw input:checked+span{background:var(--accent)}
.sw input:checked+span::after{transform:translateX(22px)}
.save{width:100%;margin-top:18px;padding:16px;border-radius:99px;background:var(--accent);color:var(--on-accent);font-weight:700;text-align:center;transition:opacity .2s,transform .15s}
.save:disabled{opacity:.35;cursor:default}
.save:not(:disabled):active{transform:scale(.97)}
.stepper{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px}
.stepper button{width:58px;height:58px;border-radius:50%;background:#ffffff1a;border:1px solid var(--edge-2);display:grid;place-content:center;font-size:1.6rem;line-height:1;text-align:center;transition:transform .15s}
.stepper button:active{transform:scale(.9)}
.stepper .val{margin:0;text-align:center}
.mrow{display:flex;justify-content:space-between;align-items:center;padding:16px 4px;border-top:1px solid var(--edge);width:100%;font-weight:500}
.mrow:first-of-type{border-top:0}
.mrow.on{color:var(--accent);font-weight:700}
.toast{position:absolute;left:50%;top:max(14px,env(safe-area-inset-top,0px));transform:translate(-50%,-90px);z-index:9;background:#f2f2f2;color:#000;font-weight:600;padding:12px 18px;border-radius:99px;box-shadow:0 10px 30px #000a;transition:transform .35s cubic-bezier(.2,.9,.2,1);max-width:90%;text-align:center}
.toast.on{transform:translate(-50%,0)}
.grabarea{padding:0 0 12px;touch-action:none;cursor:grab}
.tx:active{opacity:.7}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.areafade{opacity:1}}
</style>

<div class="phone" id="phone">
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <div class="screens">

    <section class="screen on" id="s-inicio" aria-label="Início">
      <div class="bar">

          <button class="round" id="eye" type="button" aria-label="Esconder valores" aria-pressed="false">
            <svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
          <button class="mesbtn" type="button" id="mesbtn"><span id="mesnome">Out 2026</span> <svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>

        <button type="button" data-go="atividades" aria-label="Atividades"><svg viewBox="0 0 24 24"><path d="M7 4v14M3 14l4 4 4-4M17 20V6M13 10l4-4 4 4"/></svg><b class="pdot" id="pdot" hidden></b></button>

<script>
// Tudo em centavos inteiros (fictício).
function fit(w,total){var s=w.reduce(function(a,b){return a+b},0),out=[],acc=0;
  w.forEach(function(x,i){var v=i===w.length-1?total-acc:Math.round(x/s*total);out.push(v);acc+=v});return out}
var ASSIN=[["Streaming Plus",3990],["Música+",2190],["Nuvem 200 GB",1990],["Academia Forma",6810]];
var DATA=[
 {nome:"Setembro 2026",curto:"Set 2026",rec:420000,hoje:30,
  cats:{"Moradia":110000,"Alimentação":70540,"Transporte":31200,"Delivery":12400,"Assinaturas":14980,"Outros":62130},
  dia:[110000].concat(fit([8,0,14,6,20,4,0,28,11,7,22,13,20,5,0,17,9,22,4,0,25,11,9,18,13,8,0,15,10],301250-110000)),

function bindChart(){

    bub.textContent="Dia "+(i+1)+" · "+brl(acum[i]);
    bub.style.left=Math.max(60,Math.min(r.width-60,cx/W*r.width))+"px"; bub.classList.add("on");
    $("gl").textContent="Gasto até o dia "+(i+1);
    $("gv").removeAttribute("data-c"); $("gv").textContent=brl(acum[i]);

  function leave(){
    bub.classList.remove("on"); $("gx").setAttribute("opacity",0);
    $("gd").setAttribute("cx",6+(W-18)); $("gd").setAttribute("cy",H-10-acum[n-1]/max*(H-30));

  }

  cw.addEventListener("pointerdown",function(e){cw.setPointerCapture(e.pointerId);at(e)});
  cw.addEventListener("pointermove",function(e){if(e.pressure>0||e.pointerType==="mouse")at(e)});
  cw.addEventListener("pointerup",leave); cw.addEventListener("pointerleave",leave); cw.addEventListener("pointercancel",leave);
}

    txEdit=arg; var x=MES.tx[arg]; pickSel=null;
    h='<h2>'+esc(x.n)+'</h2><div class="lbl">'+esc(x.q)+' · '+esc(x.o)+'</div>'+
      '<div class="val big n v '+(x.v>0?"pos":"")+'" style="margin-top:14px">'+brl(x.v,true)+'</div>';
    if(x.v<0){
      h+='<div class="lbl" style="margin-top:20px">'+(x.p?"Escolha a categoria":"Categoria")+'</div><div class="pickgrid" id="pickgrid">'+
        CATS.concat(["Assinaturas"].filter(function(c){return CATS.indexOf(c)<0})).map(function(c){
          return '<button type="button" class="pk'+(c===x.c?" on":"")+'" data-pick="'+esc(c)+'"><i style="background:'+COR[c]+'"></i>'+esc(c)+'</button>'}).join("")+'</div>'+
        '<label class="rule"><span>Lembrar para sempre<small>Regra: «'+esc(x.n)+'» vai para a categoria escolhida</small></span>'+
        '<span class="sw"><input type="checkbox" id="lembrar"><span></span></span></label>'+
        '<button type="button" class="save" id="save" disabled>Salvar</button>';
    }
  }
  if(kind==="lim"){
    limEdit={k:arg,v:LIM[arg]}; var u=MES.cats[arg]||0;
    h='<h2>'+esc(arg)+'</h2><div class="lbl">Limite mensal · gasto até agora '+brl(u)+'</div>'+
      '<div class="stepper"><button type="button" data-step="-1000" aria-label="Diminuir">−</button><div class="val big n" id="limv">'+brl(LIM[arg])+'</div><button type="button" data-step="1000" aria-label="Aumentar">+</button></div>'+
      '<div class="track"><div class="fill" id="limf" style="width:'+Math.min(u/LIM[arg],1)*100+"%"+'"></div></div>'+
      '<div class="meta"><span id="limp"></span><span id="limm"></span></div>'+
      '<button type="button" class="save" id="savelim">Salvar limite</button>';
  }
  $("sheet").innerHTML='<div class="grabarea" id="grabarea"><div class="grab"></div></div>'+h;
  $("sheetwrap").classList.add("on");
  counts($("sheet"));
  if(kind==="lim")updLim();
}
function updLim(){
  var u=MES.cats[limEdit.k]||0, p=u/limEdit.v, est=p>1, av=!est&&p>=.8;
  $("limv").textContent=brl(limEdit.v);
  var f=$("limf"); f.style.width=Math.min(p,1)*100+"%"; f.style.background=est?"var(--neg)":av?"var(--warn)":COR[limEdit.k];
  $("limp").textContent=Math.round(p*100)+"% usado";
  $("limm").textContent=est?"estourou "+brl(u-limEdit.v):"faltam "+brl(limEdit.v-u);
}
function reclass(x,nc){
  var a=Math.abs(x.v);
  if(x.p){MES.cats["Outros"]-=a}else if(x.c&&MES.cats[x.c]!==undefined){MES.cats[x.c]-=a}
  MES.cats[nc]=(MES.cats[nc]||0)+a; x.c=nc; x.p=0;
}

document.addEventListener("click",function(e){
  var el;
  if(e.target===$("sheetwrap")){closeSheet();return}
  if((el=e.target.closest("[data-open]"))){openSheet(el.dataset.open);return}
  if((el=e.target.closest("[data-tx]"))){openSheet("tx",+el.dataset.tx);return}
  if((el=e.target.closest("[data-lim]"))){openSheet("lim",el.dataset.lim);return}
  if((el=e.target.closest("[data-mes]"))){mi=+el.dataset.mes;MES=DATA[mi];selCat=null;closeSheet();renderAll();toast(MES.nome);return}
  if((el=e.target.closest("[data-pick]"))){
    pickSel=el.dataset.pick;
    document.querySelectorAll(".pk").forEach(function(b){b.classList.toggle("on",b.dataset.pick===pickSel)});
    $("save").disabled=(pickSel===MES.tx[txEdit].c); return}
  if((el=e.target.closest("[data-step]"))){limEdit.v=Math.max(1000,limEdit.v+(+el.dataset.step));updLim();return}
  if((el=e.target.closest("[data-f2]"))){filtro=el.dataset.f2;go("atividades");return}
  if((el=e.target.closest("[data-go]"))){go(el.dataset.go);return}
  if((el=e.target.closest("[data-tab]"))){tab=el.dataset.tab;selCat=null;renderTab();return}
  if((el=e.target.closest("[data-cat]"))){
    var c=el.dataset.cat; selCat=selCat===c?null:c;
    var seg=$("seg"); seg.className="seg"+(selCat?" has":"");
    seg.querySelectorAll("button").forEach(function(b){b.classList.toggle("pick",b.dataset.cat===selCat)});
    $("segline").innerHTML=selCat?'<span><b>'+esc(selCat)+'</b></span><span class="n v">'+brl(MES.cats[selCat])+' · '+Math.round(MES.cats[selCat]/gasto*100)+'%</span>'
      :'<span class="lbl">Toque numa faixa</span><span class="lbl">'+Object.keys(MES.cats).length+' categorias</span>';
    return}
  if((el=e.target.closest("[data-f]"))){filtro=el.dataset.f;renderAtividades();return}
  if(e.target.closest("#save")&&pickSel){
    var x=MES.tx[txEdit], rule=$("lembrar").checked, nome=x.n, n=1;
    reclass(x,pickSel);
    if(rule)MES.tx.forEach(function(o){if(o!==x&&o.p&&o.n===nome){reclass(o,pickSel);n++}});
    closeSheet(); renderAll();
    toast(rule?"Regra criada: "+nome+" → "+pickSel:"Categorizado em "+pickSel); return}
  if(e.target.closest("#savelim")){
    LIM[limEdit.k]=limEdit.v; closeSheet(); renderOrc(); fillBars($("s-orcamentos")); renderTab();
    toast("Limite de "+limEdit.k+" atualizado"); return}
});
$("importar").onclick=function(){openSheet("importar")};
$("plus").onclick=function(){openSheet("novo")};
$("mesbtn").onclick=function(){openSheet("mes")};
$("busca").addEventListener("input",function(e){busca=e.target.value;renderAtividades()});
$("eye").onclick=function(){var h=$("phone").classList.toggle("hide"); $("eye").setAttribute("aria-pressed",h)};

// Arrastar a gaveta para baixo fecha.
(function(){
  var sh=$("sheet"), y0=null, dy=0;
  sh.addEventListener("pointerdown",function(e){if(!e.target.closest("#grabarea"))return; y0=e.clientY; dy=0; sh.style.transition="none"; sh.setPointerCapture(e.pointerId)});
  sh.addEventListener("pointermove",function(e){if(y0===null)return; dy=Math.max(0,e.clientY-y0); sh.style.transform="translateY("+dy+"px)"});
  function end(){if(y0===null)return; y0=null; sh.style.transition=""; sh.style.transform=""; if(dy>90)closeSheet()}
  sh.addEventListener("pointerup",end); sh.addEventListener("pointercancel",end);
})();

var hr=new Date().getHours(); $("hello").textContent=(hr<12?"Bom dia":hr<18?"Boa tarde":"Boa noite")+", Thiago";
renderAll();
</script>
