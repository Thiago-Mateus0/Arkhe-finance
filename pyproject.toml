[project]
name = "financas"
version = "0.1.0"
description = "Finanças pessoais: importa CSV do Nubank, categoriza por regras e mostra gastos por categoria."
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
