[project]
name = "financas"
version = "0.1.0"
description = "Arkhe Finance — finanças pessoais: importa CSV do Nubank, categoriza por regras e mostra gastos por categoria."
requires-python = ">=3.11"
dependencies = ["fastapi", "uvicorn", "python-multipart"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
capturas = ["playwright"]  # só para scripts/capturas.py (screenshots do README)

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
financas = ["default_rules.json"]
