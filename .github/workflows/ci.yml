# CI: a suíte roda no repositório, não na máquina de quem abriu o PR.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    name: pytest + sintaxe do front
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check src/financas/static/app.js
      - name: front novo (tipos, testes e build)
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build
